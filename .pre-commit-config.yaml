# Pre-commit hooks — run automatically before every `git commit`.
#
# One-time setup per machine/clone:
#   pip install pre-commit
#   pre-commit install
#
# Run manually against all files any time:
#   pre-commit run --all-files
#
# Bump hook versions to latest:
#   pre-commit autoupdate
#
# These hooks are non-destructive (they block a bad commit; they don't
# silently rewrite your files). gitleaks is the load-bearing one — it stops
# secrets (API keys, tokens, private keys) from ever being committed, the
# same class of leak that the CI gitleaks job catches server-side.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-merge-conflict
      - id: check-yaml

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Claude reasoning-based security review (Ryan-spec): reads SECURITY.md and
  # reviews the outgoing diff. Runs at pre-PUSH (once per push, not per commit)
  # to keep API spend down. Advisory by default — only a 'VERDICT: BLOCK'
  # response stops the push; override any time with `git push --no-verify`.
  - repo: local
    hooks:
      - id: claude-security-review
        name: Claude security review (against SECURITY.md)
        entry: bash scripts/security-review.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

  # ── ExoGenius auto-push gate REMOVED 2026-06-13 (deliberate re-scope) ──────────────
  # Its pass-signal ("3 unaffiliated first-time users confirm the blueprint fit") is a
  # VALIDATION MILESTONE, not a per-push code review. Gating EVERY push on a behavioral
  # signal that no code change can establish made it pure friction — it blocked every
  # ship (theme, UX, infra) and was overridden every time, which is gate-as-theater.
  # The criterion is NOT deleted: it lives in the ExoGenius registry. Run it MANUALLY
  # at the moment it actually applies — when claiming VisionAir's blueprints fit:
  #   exogenius gate --deliverable visionair --evidence <session-logs>
  # Re-add a properly-scoped gate (code-evidence for routine ships, the behavioral gate
  # only for blueprint-logic changes / validation claims) when ExoGenius v2 lands.

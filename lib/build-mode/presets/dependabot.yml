# [preset] VALIDATED DEFAULT for the Next.js/TS/Vercel house stack — verify against THIS app; flag any mismatch as a gap in docs/context/07-known-gaps.md.
# Authority: GitHub Dependabot docs; OWASP A03:2025 Software Supply Chain Failures; SLSA v1.0.

version: 2

updates:
  # npm dependencies — grouped to reduce PR noise
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    groups:
      all-npm:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # GitHub Actions — grouped; keep actions current for security patches
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    groups:
      all-github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
